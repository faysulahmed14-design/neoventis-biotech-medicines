<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="24" fill="#FEF2F2"/>
  <circle cx="240" cy="175" r="136" fill="#FECACA" opacity="0.5"/>
  <!-- Soft Shadow -->
  <ellipse cx="236" cy="296" rx="152" ry="16" fill="#0F172A" opacity="0.08"/>

  <!-- Medicine Packaging Box (3D perspective) -->
  <g transform="translate(56, 74)">
    <!-- Side flap -->
    <polygon points="184,12 214,26 214,212 184,224" fill="#B91C1C" opacity="0.9"/>
    <!-- Front face -->
    <rect x="0" y="12" width="184" height="212" rx="12" fill="#FFFFFF" stroke="#B91C1C" stroke-width="3"/>
    <!-- Top Accent Band -->
    <path d="M0 24c0-6.6 5.4-12 12-12h160c6.6 0 12 5.4 12 12v34H0V24Z" fill="#B91C1C"/>
    <!-- Brand Mark -->
    <text x="18" y="40" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" fill="#FFFFFF">NEOVENTIS</text>
    <!-- Medical Plus Icon -->
    <rect x="150" y="27" width="14" height="14" rx="3" fill="#FFFFFF" opacity="0.22"/>
    <path d="M155.5 30h3v3h3v3h-3v3h-3v-3h-3v-3h3v-3Z" fill="#FFFFFF"/>

    <!-- Form Badge -->
    <rect x="18" y="76" width="84" height="22" rx="11" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <text x="60" y="91" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#B91C1C">SR TABLET</text>

    <!-- Product Name -->
    <text x="18" y="136" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#0F172A">Lipocid SR</text>

    <!-- Decorative Wave / Strip -->
    <rect x="18" y="156" width="68" height="5" rx="2.5" fill="#EF4444"/>
    <rect x="18" y="168" width="110" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="18" y="178" width="86" height="4" rx="2" fill="#E2E8F0"/>

    <!-- Bottom Strip -->
    <rect x="18" y="198" width="148" height="10" rx="5" fill="#FEF2F2"/>
  </g>

  
  <!-- Blister Strip + Loose Tablets -->
  <g transform="translate(268, 108) rotate(8 60 88)">
    <rect x="0" y="0" width="116" height="162" rx="14" fill="#FFFFFF" stroke="#B91C1C" stroke-width="3"/>
    <rect x="10" y="10" width="96" height="142" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="36" cy="36" r="14" fill="#DC2626"/>
    <circle cx="33" cy="32" r="4" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="80" cy="36" r="14" fill="#DC2626"/>
    <circle cx="77" cy="32" r="4" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="36" cy="81" r="14" fill="#DC2626"/>
    <circle cx="33" cy="77" r="4" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="80" cy="81" r="14" fill="#DC2626"/>
    <circle cx="77" cy="77" r="4" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="36" cy="126" r="14" fill="#DC2626"/>
    <circle cx="33" cy="122" r="4" fill="#FFFFFF" opacity="0.45"/>
    <circle cx="80" cy="126" r="14" fill="#DC2626"/>
    <circle cx="77" cy="122" r="4" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <g transform="translate(240, 266)">
    <ellipse cx="16" cy="12" rx="15" ry="11" fill="#FEE2E2" stroke="#B91C1C" stroke-width="2"/>
    <line x1="6" y1="12" x2="26" y2="12" stroke="#B91C1C" stroke-width="1.5"/>
  </g>
</svg>
