<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none">
  <rect width="480" height="360" rx="24" fill="#ECFDF5"/>
  <circle cx="240" cy="175" r="136" fill="#A7F3D0" opacity="0.5"/>
  <!-- Soft Shadow -->
  <ellipse cx="236" cy="296" rx="152" ry="16" fill="#0F172A" opacity="0.08"/>

  <!-- Medicine Packaging Box (3D perspective) -->
  <g transform="translate(56, 74)">
    <!-- Side flap -->
    <polygon points="184,12 214,26 214,212 184,224" fill="#047857" opacity="0.9"/>
    <!-- Front face -->
    <rect x="0" y="12" width="184" height="212" rx="12" fill="#FFFFFF" stroke="#047857" stroke-width="3"/>
    <!-- Top Accent Band -->
    <path d="M0 24c0-6.6 5.4-12 12-12h160c6.6 0 12 5.4 12 12v34H0V24Z" fill="#047857"/>
    <!-- Brand Mark -->
    <text x="18" y="40" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" fill="#FFFFFF">NEOVENTIS</text>
    <!-- Medical Plus Icon -->
    <rect x="150" y="27" width="14" height="14" rx="3" fill="#FFFFFF" opacity="0.22"/>
    <path d="M155.5 30h3v3h3v3h-3v3h-3v-3h-3v-3h3v-3Z" fill="#FFFFFF"/>

    <!-- Form Badge -->
    <rect x="18" y="76" width="84" height="22" rx="11" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="60" y="91" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#047857">CAPSULE</text>

    <!-- Product Name -->
    <text x="18" y="136" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#0F172A">Otubic</text>

    <!-- Decorative Wave / Strip -->
    <rect x="18" y="156" width="68" height="5" rx="2.5" fill="#10B981"/>
    <rect x="18" y="168" width="110" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="18" y="178" width="86" height="4" rx="2" fill="#E2E8F0"/>

    <!-- Bottom Strip -->
    <rect x="18" y="198" width="148" height="10" rx="5" fill="#ECFDF5"/>
  </g>

  
  <!-- Capsule Bottle + Floating Capsules -->
  <g transform="translate(275, 118)">
    <rect x="18" y="0" width="76" height="22" rx="6" fill="#047857"/>
    <rect x="24" y="22" width="64" height="10" fill="#10B981"/>
    <rect x="8" y="32" width="96" height="130" rx="16" fill="#FFFFFF" stroke="#047857" stroke-width="3"/>
    <rect x="8" y="64" width="96" height="62" fill="#ECFDF5"/>
    <rect x="20" y="78" width="72" height="8" rx="4" fill="#047857" opacity="0.85"/>
    <rect x="26" y="94" width="60" height="6" rx="3" fill="#10B981" opacity="0.7"/>
    <rect x="34" y="108" width="44" height="6" rx="3" fill="#94A3B8" opacity="0.6"/>
  </g>
  <!-- Two 3D Capsules -->
  <g transform="translate(244, 248) rotate(-24)">
    <rect x="0" y="0" width="52" height="22" rx="11" fill="#F8FAFC" stroke="#047857" stroke-width="2"/>
    <path d="M0 11a11 11 0 0 1 11-11h15v22H11A11 11 0 0 1 0 11Z" fill="#059669"/>
    <rect x="8" y="4" width="14" height="3.5" rx="1.75" fill="#FFFFFF" opacity="0.45"/>
  </g>
  <g transform="translate(310, 266) rotate(14)">
    <rect x="0" y="0" width="48" height="20" rx="10" fill="#F8FAFC" stroke="#047857" stroke-width="2"/>
    <path d="M0 10a10 10 0 0 1 10-10h14v20H10A10 10 0 0 1 0 10Z" fill="#059669"/>
    <rect x="7" y="3.5" width="12" height="3" rx="1.5" fill="#FFFFFF" opacity="0.45"/>
  </g>
</svg>
